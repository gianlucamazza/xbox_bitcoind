# Keep GitHub Actions majors current (aligned with xllama-style hygiene).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
  # uwp/packages.config (CppWinRT NuGet) was previously unmonitored.
  - package-ecosystem: nuget
    directory: /uwp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
