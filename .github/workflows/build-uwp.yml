name: build-uwp

# CI entry point for app/Core changes:
#   patch-check  — cheap Linux gate: pinned Core fetch + full patch-set apply (runs on PRs too)
#   uwp-scaffold — PR-only (or dispatch with_core=false), no Core
#   product      — delegates to build-product-msix.yml (single source for Core+MSIX jobs)
#
# Releases call build-product-msix.yml directly (release.yml).

on:
  push:
    branches: [main]
    paths:
      - "uwp/**"
      - "config/bitcoin-core.pin"
      - "patches/**"
      - "scripts/build-uwp.ps1"
      - "scripts/build-core-uwp.ps1"
      - "scripts/apply-uwp-patches.*"
      - "scripts/fetch-bitcoin-core.*"
      - ".github/workflows/build-uwp.yml"
      - ".github/workflows/build-product-msix.yml"
  pull_request:
    paths:
      - "uwp/**"
      - "config/bitcoin-core.pin"
      - "patches/**"
      - "scripts/build-uwp.ps1"
      - "scripts/build-core-uwp.ps1"
      - "scripts/apply-uwp-patches.*"
      - "scripts/fetch-bitcoin-core.*"
      - ".github/workflows/build-uwp.yml"
      - ".github/workflows/build-product-msix.yml"
  workflow_dispatch:
    inputs:
      with_core:
        description: "Build WithCore product path (core libs + MSIX)"
        type: boolean
        default: true
      force_core:
        description: "Force Core rebuild (ignore SkipIfFresh stamp)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A PR that breaks a patch or bumps the pin must not be green: fetch the pinned
  # tree and apply the whole patch set in order (throwaway checkout, ~2 min).
  patch-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fetch pinned Bitcoin Core
        run: ./scripts/fetch-bitcoin-core.sh
      - name: Apply UWP patch set
        run: ./scripts/apply-uwp-patches.sh

  uwp-scaffold:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.with_core == false)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - uses: nuget/setup-nuget@v4
      - name: Build UWP package (scaffold)
        shell: pwsh
        run: .\scripts\build-uwp.ps1 -Configuration Release -BuildRevision ${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: xbox_bitcoind-msix-scaffold
          path: |
            uwp/AppPackages/**/*.msix
            uwp/AppPackages/**/*.appx
            uwp/xbox_bitcoind-dev.cer
          if-no-files-found: error
          retention-days: 7

  # Single source for Core+MSIX: build-product-msix.yml (used by release.yml too).
  product:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.with_core == true)
    needs: [patch-check]
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build-product-msix.yml
    with:
      force_core: ${{ github.event_name == 'workflow_dispatch' && inputs.force_core || false }}
      build_revision: "0"
