name: build-uwp

# UWP package only. Does not rebuild the desktop MSVC baseline (see ci-msvc-baseline).
# Path filters exclude docs and bitcoin.conf.console (runtime defaults, not build inputs).

on:
  push:
    branches: [main]
    paths:
      - "uwp/**"
      - "config/bitcoin-core.pin"
      - "patches/**"
      - "scripts/build-uwp.ps1"
      - "scripts/build-core-uwp.ps1"
      - "scripts/apply-uwp-patches.*"
      - "scripts/fetch-bitcoin-core.*"
      - ".github/workflows/build-uwp.yml"
  pull_request:
    paths:
      - "uwp/**"
      - "config/bitcoin-core.pin"
      - "patches/**"
      - "scripts/build-uwp.ps1"
      - "scripts/build-core-uwp.ps1"
      - "scripts/apply-uwp-patches.*"
      - "scripts/fetch-bitcoin-core.*"
      - ".github/workflows/build-uwp.yml"
  workflow_dispatch:
    inputs:
      with_core:
        description: "Build and link Bitcoin Core into the MSIX (slow)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast path: scaffold without Core.
  # PR: always (validates UI/probes package).
  # Dispatch with with_core=false: scaffold only.
  # main push: skipped — uwp-core already produces the product MSIX (avoids double Windows bill).
  uwp-scaffold:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.with_core == false)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Build UWP package (scaffold)
        shell: pwsh
        run: .\scripts\build-uwp.ps1 -Configuration Release -BuildRevision ${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: xbox_bitcoind-msix-scaffold
          path: |
            uwp/AppPackages/**/*.msix
            uwp/AppPackages/**/*.appx
            uwp/xbox_bitcoind-dev.cer
          if-no-files-found: error
          retention-days: 7

  # Full path: Core UWP libs + linked package (product artifact).
  # Bitcoin Core v31.1 requires VS 2026 18.3+. Same runner family as ci-msvc-baseline
  # but different target (WindowsStore / x64-uwp) — not interchangeable with desktop MSVC.
  uwp-core:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.with_core == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2

      - name: Ensure UWP C++ workload (VS 2026)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $ip = & $vswhere -latest -products * -property installationPath
          if (-not $ip) { throw "Visual Studio installation not found" }
          Write-Host "VS install: $ip"
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.ComponentGroup.UWP.VC -property installationPath 2>$null
          $setup = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\setup.exe"
          if (Test-Path $setup) {
            Write-Host "Adding UWP VC + Windows app development components if missing ..."
            & $setup modify --installPath $ip `
              --add Microsoft.VisualStudio.ComponentGroup.UWP.VC `
              --add Microsoft.VisualStudio.ComponentGroup.WindowsAppDevelopment.Prerequisites `
              --add Microsoft.VisualStudio.Workload.Universal `
              --quiet --norestart --force |
              Out-Host
            Write-Host "setup.exe exit: $LASTEXITCODE"
          }

      - name: Cache vcpkg UWP + core build
        uses: actions/cache@v6
        with:
          path: |
            third_party/bitcoin/build-uwp
            ~/AppData/Local/vcpkg/archives
            C:/vcpkg/installed/x64-uwp
            C:/vcpkg-bt
          key: core-uwp-v3-vs2026-${{ hashFiles('config/bitcoin-core.pin', 'patches/uwp/**') }}
          restore-keys: |
            core-uwp-v3-vs2026-

      - name: Build UWP package with Core
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_INSTALLATION_ROOT: C:\vcpkg
        run: |
          if (Test-Path third_party\bitcoin\build-uwp\CMakeCache.txt) {
            $gen = Select-String -Path third_party\bitcoin\build-uwp\CMakeCache.txt -Pattern 'CMAKE_GENERATOR:' | ForEach-Object { $_.Line }
            if ($gen -match 'Ninja') {
              Write-Host "Removing stale Ninja build dir"
              Remove-Item -Recurse -Force third_party\bitcoin\build-uwp
            }
          }
          .\scripts\build-uwp.ps1 -Configuration Release -BuildRevision ${{ github.run_number }} -WithCore

      - uses: actions/upload-artifact@v7
        with:
          name: xbox_bitcoind-msix-core
          path: |
            uwp/AppPackages/**/*.msix
            uwp/AppPackages/**/*.appx
            uwp/xbox_bitcoind-dev.cer
          if-no-files-found: error
          retention-days: 7
