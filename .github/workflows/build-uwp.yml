name: build-uwp

on:
  push:
    branches: [main]
    paths:
      - "uwp/**"
      - "config/bitcoin.conf.console"
      - "scripts/build-uwp.ps1"
      - ".github/workflows/build-uwp.yml"
  pull_request:
    paths:
      - "uwp/**"
      - "config/bitcoin.conf.console"
      - "scripts/build-uwp.ps1"
      - ".github/workflows/build-uwp.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  uwp:
    # Prefer VS2022 image for stable UWP SDK 22621 / v143 (same as xllama).
    # Override via workflow_dispatch later if moving fully to VS2026.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install NuGet
        uses: nuget/setup-nuget@v2

      - name: Build UWP package
        id: build
        shell: pwsh
        run: |
          .\scripts\build-uwp.ps1 -Configuration Release -BuildRevision ${{ github.run_number }}

      - name: Upload MSIX + cert
        uses: actions/upload-artifact@v7
        with:
          name: xbox_bitcoind-msix
          path: |
            uwp/AppPackages/**/*.msix
            uwp/AppPackages/**/*.appx
            uwp/xbox_bitcoind-dev.cer
          if-no-files-found: error
          retention-days: 14
