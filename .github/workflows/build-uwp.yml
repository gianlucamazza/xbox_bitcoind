name: build-uwp

# Split pipeline (fast path when only the UWP app changes):
#   core-uwp    — Core static libs; SkipIfFresh if pin/patches cache warm
#   package-uwp — MSIX only (SkipCoreBuild); reuses this run's core cache entry
#   uwp-scaffold — PR-only, no Core
#
# Cache key includes github.run_id on save so package always sees this run's libs.

on:
  push:
    branches: [main]
    paths:
      - "uwp/**"
      - "config/bitcoin-core.pin"
      - "patches/**"
      - "scripts/build-uwp.ps1"
      - "scripts/build-core-uwp.ps1"
      - "scripts/apply-uwp-patches.*"
      - "scripts/fetch-bitcoin-core.*"
      - ".github/workflows/build-uwp.yml"
  pull_request:
    paths:
      - "uwp/**"
      - "config/bitcoin-core.pin"
      - "patches/**"
      - "scripts/build-uwp.ps1"
      - "scripts/build-core-uwp.ps1"
      - "scripts/apply-uwp-patches.*"
      - "scripts/fetch-bitcoin-core.*"
      - ".github/workflows/build-uwp.yml"
  workflow_dispatch:
    inputs:
      with_core:
        description: "Build WithCore product path (core libs + MSIX)"
        type: boolean
        default: true
      force_core:
        description: "Force Core rebuild (ignore SkipIfFresh stamp)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Shared prefix for restore-keys (pin + patches only).
  CORE_CACHE_PREFIX: core-uwp-v4-vs2026

jobs:
  # PR-only scaffold (no Core).
  uwp-scaffold:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.with_core == false)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - uses: nuget/setup-nuget@v4
      - name: Build UWP package (scaffold)
        shell: pwsh
        run: .\scripts\build-uwp.ps1 -Configuration Release -BuildRevision ${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: xbox_bitcoind-msix-scaffold
          path: |
            uwp/AppPackages/**/*.msix
            uwp/AppPackages/**/*.appx
            uwp/xbox_bitcoind-dev.cer
          if-no-files-found: error
          retention-days: 7

  # Stage 1: Core UWP libraries only.
  core-uwp:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.with_core == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v7

      - name: Restore Core / vcpkg cache
        uses: actions/cache/restore@v6
        with:
          path: |
            third_party/bitcoin/build-uwp
            ~/AppData/Local/vcpkg/archives
            C:/vcpkg/installed/x64-uwp
            C:/vcpkg-bt
          key: ${{ env.CORE_CACHE_PREFIX }}-${{ hashFiles('config/bitcoin-core.pin', 'patches/uwp/**') }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CORE_CACHE_PREFIX }}-${{ hashFiles('config/bitcoin-core.pin', 'patches/uwp/**') }}-
            ${{ env.CORE_CACHE_PREFIX }}-

      - name: Build Core UWP libraries
        shell: pwsh
        env:
          XBB_CORE_SKIP_IF_FRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_core && '0' || '1' }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.force_core }}" -eq "true") {
            .\scripts\build-uwp.ps1 -Configuration Release -CoreOnly -ForceCore
          } else {
            $env:XBB_CORE_SKIP_IF_FRESH = "1"
            .\scripts\build-uwp.ps1 -Configuration Release -CoreOnly
          }
          if (-not (Test-Path "third_party\bitcoin\build-uwp\xbb-core-libs.props")) {
            throw "missing xbb-core-libs.props after core build"
          }
          if (-not (Get-ChildItem "third_party\bitcoin\build-uwp" -Recurse -Filter "bitcoin_embed.lib" -EA SilentlyContinue)) {
            throw "missing bitcoin_embed.lib after core build"
          }

      # Always save under run_id key so package-uwp sees this run's tree.
      - name: Save Core / vcpkg cache
        uses: actions/cache/save@v6
        with:
          path: |
            third_party/bitcoin/build-uwp
            ~/AppData/Local/vcpkg/archives
            C:/vcpkg/installed/x64-uwp
            C:/vcpkg-bt
          key: ${{ env.CORE_CACHE_PREFIX }}-${{ hashFiles('config/bitcoin-core.pin', 'patches/uwp/**') }}-${{ github.run_id }}

  # Stage 2: MSIX package only (no Core recompile).
  package-uwp:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.with_core == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [core-uwp]
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - uses: nuget/setup-nuget@v4

      - name: Ensure UWP C++ workload if missing
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $ip = & $vswhere -latest -products * -property installationPath
          if (-not $ip) { throw "Visual Studio installation not found" }
          $uwp = & $vswhere -latest -products * -requires Microsoft.VisualStudio.ComponentGroup.UWP.VC -property installationPath 2>$null
          if ($uwp) {
            Write-Host "UWP.VC already present"
            exit 0
          }
          $setup = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\setup.exe"
          Write-Host "Installing UWP VC components ..."
          & $setup modify --installPath $ip `
            --add Microsoft.VisualStudio.ComponentGroup.UWP.VC `
            --add Microsoft.VisualStudio.ComponentGroup.WindowsAppDevelopment.Prerequisites `
            --add Microsoft.VisualStudio.Workload.Universal `
            --quiet --norestart --force | Out-Host

      - name: Restore Core cache from this run
        uses: actions/cache/restore@v6
        with:
          path: |
            third_party/bitcoin/build-uwp
            ~/AppData/Local/vcpkg/archives
            C:/vcpkg/installed/x64-uwp
            C:/vcpkg-bt
          key: ${{ env.CORE_CACHE_PREFIX }}-${{ hashFiles('config/bitcoin-core.pin', 'patches/uwp/**') }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Package MSIX (SkipCoreBuild)
        shell: pwsh
        run: |
          .\scripts\build-uwp.ps1 -Configuration Release -BuildRevision ${{ github.run_number }} -WithCore -SkipCoreBuild

      - uses: actions/upload-artifact@v7
        with:
          name: xbox_bitcoind-msix-core
          path: |
            uwp/AppPackages/**/*.msix
            uwp/AppPackages/**/*.appx
            uwp/xbox_bitcoind-dev.cer
          if-no-files-found: error
          retention-days: 7
