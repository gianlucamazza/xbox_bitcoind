name: ci-linux

# Path-scoped: docs/UI-only commits do not start this workflow.
# Inside the workflow, full Core smoke runs only when pin/fetch/smoke scripts change
# (not on every deploy.sh / env.sh edit — those only need shellcheck).

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "uwp/ui_layout.h"
      - "uwp/json_extract.h"
      - "uwp/node_host.cpp"
      - "uwp/probes.cpp"
      - "uwp/xbb_version.generated.h"
      - "config/bitcoin.conf.console"
      - "config/bitcoin-core.pin"
      - "PSScriptAnalyzerSettings.psd1"
      - ".ruff.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scripts/**"
      - "uwp/ui_layout.h"
      - "uwp/json_extract.h"
      - "uwp/node_host.cpp"
      - "uwp/probes.cpp"
      - "uwp/xbb_version.generated.h"
      - "config/bitcoin.conf.console"
      - "config/bitcoin-core.pin"
      - "PSScriptAnalyzerSettings.psd1"
      - ".ruff.toml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Build and run Bitcoin Core unit tests"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read  # dorny/paths-filter@v4 on pull_request

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      smoke: ${{ steps.set.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            smoke:
              - 'config/bitcoin-core.pin'
              - 'scripts/fetch-bitcoin-core.sh'
              - 'scripts/build-linux-smoke.sh'
              - '.github/workflows/ci-linux.yml'
      - name: Export smoke flag
        id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke=${{ steps.filter.outputs.smoke }}" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: shellcheck
        run: shellcheck -x -S style scripts/*.sh

      - name: actionlint (workflow lint)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

      - name: PSScriptAnalyzer (PowerShell lint)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit

      - name: ruff (Python lint)
        run: |
          pipx install ruff >/dev/null 2>&1 || pip install --user ruff
          ruff check scripts/

      - name: Pure UI layout unit tests
        run: ./scripts/test-ui-layout.sh

      - name: Pure JSON extractor unit tests
        run: ./scripts/test-rpc-client.sh

      - name: Embedded conf fallback sync check
        run: ./scripts/check-conf-sync.sh

      - name: Validate bitcoin-core.pin + generated version header
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f config/bitcoin-core.pin
          grep -E '^TAG=v[0-9]' config/bitcoin-core.pin
          grep -E '^COMMIT=[0-9a-f]{40}$' config/bitcoin-core.pin
          grep -E '^REPO_URL=https://' config/bitcoin-core.pin
          PIN=$(grep -E '^TAG=' config/bitcoin-core.pin | cut -d= -f2)
          COMMIT=$(grep -E '^COMMIT=' config/bitcoin-core.pin | cut -d= -f2)
          python3 scripts/generate-version-header.py
          grep -F "XBB_CORE_TAG \"$PIN\"" uwp/xbb_version.generated.h
          grep -F "XBB_CORE_COMMIT \"$COMMIT\"" uwp/xbb_version.generated.h
          # Fail if generated header drifted from pin without regenerate/commit.
          git diff --exit-code -- uwp/xbb_version.generated.h
          # Pin-lag check is advisory (::warning) — never fail lint on API rate limits.
          LATEST="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/bitcoin/bitcoin/releases/latest | jq -r .tag_name || true)"
          echo "pin=$PIN latest_release=${LATEST:-unknown}"
          if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
            echo "::warning::Could not query latest Bitcoin Core release — skipping pin-lag check"
          elif [[ "$PIN" != "$LATEST" ]]; then
            echo "::warning::Bitcoin Core pin $PIN is behind latest release $LATEST — bump config/bitcoin-core.pin when ready"
          fi

  smoke:
    runs-on: ubuntu-24.04
    needs: [changes, lint]
    if: needs.changes.outputs.smoke == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build ccache pkg-config python3 \
            libboost-dev libevent-dev

      - name: Fetch pinned Bitcoin Core
        run: ./scripts/fetch-bitcoin-core.sh

      - name: Cache Linux smoke build + ccache
        uses: actions/cache@v6
        with:
          path: |
            third_party/bitcoin/build-linux-smoke
            .ccache-linux-smoke
          key: linux-smoke-v2-${{ hashFiles('config/bitcoin-core.pin') }}-${{ runner.os }}
          restore-keys: |
            linux-smoke-v2-${{ hashFiles('config/bitcoin-core.pin') }}-
            linux-smoke-v2-

      - name: Linux smoke build
        id: build
        env:
          CI_SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests && '0' || '1' }}
          BUILD_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests && 'ON' || 'OFF' }}
          CMAKE_BUILD_TYPE: Release
          CCACHE_DIR: ${{ github.workspace }}/.ccache-linux-smoke
        run: ./scripts/build-linux-smoke.sh

      - name: Assert version string
        run: |
          set -euo pipefail
          TAG=$(grep -E '^TAG=' config/bitcoin-core.pin | cut -d= -f2)
          BITCOIND="${{ steps.build.outputs.bitcoind }}"
          if [[ -z "${BITCOIND}" || ! -x "${BITCOIND}" ]]; then
            BITCOIND=$(find third_party/bitcoin/build-linux-smoke -type f -name bitcoind | head -n1)
          fi
          test -n "${BITCOIND}"
          VER=$("${BITCOIND}" -version | head -n1)
          echo "version: $VER"
          echo "$VER" | grep -F "$TAG"

      - name: Upload bitcoind artifact
        uses: actions/upload-artifact@v7
        with:
          name: bitcoind-linux-x64
          path: |
            third_party/bitcoin/build-linux-smoke/bin/bitcoind
            third_party/bitcoin/build-linux-smoke/bin/bitcoin-cli
          if-no-files-found: warn
          retention-days: 7
