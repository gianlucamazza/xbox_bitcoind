# Local TCP forwarding for user gmazza only (lab / Xbox Device Portal).
# Global policy remains AllowTcpForwarding no (see hardening.conf).
#
# local  = client -L / -D only (no remote -R)
# PermitOpen = destination whitelist (LAN Xbox portal)
#
# Applied: 2026-07-31 — xbox_bitcoind console-via-odroid path
Match User gmazza
    AllowTcpForwarding local
    PermitOpen 192.168.1.44:11443
