# Example: local TCP forwarding for one operator user (Xbox Device Portal).
# Global policy can remain AllowTcpForwarding no (see your hardening drop-in).
#
# local  = client -L / -D only (no remote -R)
# PermitOpen = destination whitelist (console portal on the jump host's LAN)
#
# Replace <user> and <console-ip> before installing under sshd_config.d/.
Match User <user>
    AllowTcpForwarding local
    PermitOpen <console-ip>:11443
